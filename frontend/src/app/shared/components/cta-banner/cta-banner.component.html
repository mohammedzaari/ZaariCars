<section class="cta-banner">
  <h2 class="cta-banner__title">{{ title() }}</h2>
  <p class="cta-banner__subtitle">{{ subtitle() }}</p>
  <div class="cta-banner__actions">
    <button class="btn btn--primary" (click)="primaryAction.emit()">{{ primaryLabel() }}</button>
    <button class="btn btn--outline" (click)="secondaryAction.emit()">{{ secondaryLabel() }}</button>
  </div>
</section>
